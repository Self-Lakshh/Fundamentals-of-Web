<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 10 - Responsive Grid Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="title">My Travel Journal</h2>
    <p class="subtitle">Captured highlights using CSS Grid for alignment</p>
    
    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400" alt="Misty Mountains">
            <div class="caption">Misty Mountains</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400" alt="Sunny Beaches">
            <div class="caption">Sunny Beaches</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400" alt="Deep Forest">
            <div class="caption">Deep Forest</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1472214222541-d510753a4707?w=400" alt="Green Valley">
            <div class="caption">Green Valley</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400" alt="Lake views">
            <div class="caption">Lake views</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=400" alt="Autumn Woods">
            <div class="caption">Autumn Woods</div>
        </div>
    </div>
</body>
</html>
